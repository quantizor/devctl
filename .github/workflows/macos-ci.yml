name: macOS CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show Swift version
        run: swift --version

      - name: Run test suite
        run: make test

  codeql:
    name: Static analysis
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          build-mode: manual
          languages: swift

      - name: Build for CodeQL
        run: make build

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
