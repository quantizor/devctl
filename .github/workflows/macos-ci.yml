name: macOS CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Run test suite
        run: make test

  codeql:
    name: Static analysis
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ hashFiles('Package.resolved') }}
          path: ~/Library/Caches/org.swift.swiftpm

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          build-mode: manual
          dependency-caching: true
          languages: swift

      - name: Build for CodeQL
        run: |
          swift build --arch arm64 --product devctl
          swift build --arch arm64 --product devctld

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
