# GitHub-only releases via Changesets (ubuntu; no macOS minutes).
# Creates/updates the Version Packages PR; on merge, tags vX.Y.Z and
# opens a GitHub release from CHANGELOG.md. Does not publish to npm.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or GitHub Release
        id: changesets
        uses: changesets/action@v1
        with:
          title: Version Packages
          commit: Version Packages
          version: npm run version
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN do not fire release:published on
      # other workflows. Dispatch the DMG job explicitly (workflow_dispatch is
      # the documented exception). Tag from the just-published package version.
      - name: Kick DMG build
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[0].version')"
          [[ -n "$VERSION" && "$VERSION" != null ]] || {
            echo "Kick DMG: missing publishedPackages version" >&2
            exit 1
          }
          # Run the workflow definition from main; checkout inside the job
          # still pins to the release tag via the tag input.
          gh workflow run "Release DMG" --ref main -f "tag=v${VERSION}"
